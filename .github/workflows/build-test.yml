name: Build & test

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, tests, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # toolchain, components and targets from rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Core compiles to wasm32-unknown-unknown
        run: cargo build -p flatsql-core --target wasm32-unknown-unknown --release

  wasm-js:
    name: WASM package, bridge and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # toolchain, components and targets from rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Benchmark smoke run
        run: node bench/run.js --targets node --runs 1 --rows 5000 --kinds workload --out bench/results/ci-smoke

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
